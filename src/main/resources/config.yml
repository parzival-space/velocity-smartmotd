# The working mode of the plugin.
# SIMPLE:       Define one motd for the entire network with placeholders.
# NETWORK:      Define a motd for each server in the network with placeholders.
#               The plugin will identify which motd to display based on the hostname the clients try to connect to.
# PASSTHROUGH:  The plugin will inject the placeholders into the motd of the backend server or proxy.
#               This can be used if you use another plugin that modifies the motd but still wants to use the placeholders.
mode: NETWORK


# List of available placeholders:
# {{server_hostname}}   The hostname the client tries to connect to.
# {{client_ip}}         The IP address of the client.
# {{client_port}}       The port of the client connection. This will change with each connection.
# {{ping_time}}         The time of the day when the client pinged the server.
# {{ping_time_24}}      The time of the day when the client pinged the server in 24h format.
# {{ping_date}}         The date when the client pinged the server.


# SIMPLE MODE
# To enable this mode, set the mode to SIMPLE above.
# The information below will be displayed to all clients that connect to the server.
# When you set a field to null, the plugin will pass the backend server's value to the client.
simple:
  version: "Injected Version"
  motd: "Injected MOTD supports MiniMessage"
  favicon: null # Path to the favicon file. Can be a base64 string or a file path.
  players:
    current: 0
    max: 0
    samples: null

# NETWORK MODE
# To enable this mode, set the mode to NETWORK above.
# Clients will see different motds based on the hostname they try to connect to.
# When you set a field to null, the plugin will pass the backend server's value to the client.
network:
  default:
    version: "Default Version"
    motd: "Default MOTD supports MiniMessage"
    favicon: "icon.png" # Path to the favicon file. Can be a base64 string or a file path.
    players:
      current: null
      max: null
      samples:
        - "Default Player 1"
        - "Default Player 2"
        - "Default Player 3"
  "example.com":
    version: "Custom Version"
    motd: "Injected MOTD supports MiniMessage"
    favicon: null # Path to the favicon file. Can be a base64 string or a file path.
    players:
      current: 0
      max: 0
      samples:
        - "Your IP: {{client_ip}}"
        - "Server: {{server_hostname}}"